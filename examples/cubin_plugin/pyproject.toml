[build-system]
requires = [
    "scikit-build-core>=0.11,<2",
    "nanobind>=2.4,<3",
    "tensoracle",
    "nvidia-cuda-runtime==13.2.*",
    "nvidia-cuda-crt==13.2.*",
]
build-backend = "scikit_build_core.build"

[project]
name = "tensoracle-cubin-example"
version = "0.1.0"
description = "Two TensorRT V3 plugins using tensoracle's cubin tools"
requires-python = ">=3.12,<3.14"
dependencies = ["tensoracle", "cuda-python>=13.0"]

[tool.scikit-build]
wheel.packages = ["example_cubin_plugin"]
cmake.source-dir = "."
wheel.py-api = "cp312"
build.tool-args = ["-j4"]
