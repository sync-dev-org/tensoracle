[project]
name = "tensoracle"
dynamic = ["version"]
description = "Build, save, reuse, and execute TensorRT engines from safetensors weights"
authors = [{ name = "minamik", email = "mia@sync.dev" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "safetensors>=0.4",
]

[project.scripts]
tensoracle = "tensoracle._cli:main"

[project.urls]
documentation = "https://sync-dev-org.github.io/tensoracle/"
repository = "https://github.com/sync-dev-org/tensoracle"
issues = "https://github.com/sync-dev-org/tensoracle/issues"

[project.optional-dependencies]
convert = ["torch>=2.6"]
tensorrt = ["tensorrt-cu13>=11.2,<12"]
producer = [
    "nvidia-cuda-nvrtc==13.2.*",
    "nvidia-cuda-nvcc==13.2.*",
    "nvidia-cuda-cuobjdump==13.2.*",
    "nvidia-cuda-crt==13.2.*",
    "nvidia-nvvm==13.2.*",
]

[build-system]
requires = [
    "conan==2.34.0",
    "scikit-build-core>=0.11,<2",
    "nanobind>=2.4,<3",
    "setuptools-scm>=8",
]
build-backend = "build_backend"
backend-path = ["."]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
version_scheme = "only-version"
local_scheme = "no-local-version"
version_file = "src/tensoracle/_version.py"

[tool.scikit-build]
minimum-version = "0.11"
wheel.packages = ["src/tensoracle"]
wheel.py-api = "cp312"
build.tool-args = ["-j8"]
sdist.include = ["src/tensoracle/_version.py"]

sdist.exclude = [
    "/.nf/",
    "/.github/",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/intro/",
    "/tools/",
    "/noren.yaml",
    "/noren-words.txt",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
dev = [
    { include-group = "docs" },
    "tensoracle[tensorrt]",
    "cuda-python>=13.0",
    "cupy-cuda13x>=14.2.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "build_backend.py" },
    { file = "CMakeLists.txt" },
    { file = "bindings.cpp" },
    { file = "cubin_bindings.cpp" },
    { file = "../cpp/**" },
    { git = { commit = true, tags = true } },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "gpu: tests that build or load a TensorRT engine on a CUDA GPU",
    "req(id): ID of the adopted spec item that the test verifies",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/tensoracle/_version.py"]
