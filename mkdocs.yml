site_name: tensoracle
site_description: Build, save, and reuse TensorRT engines from caller-defined graphs
docs_dir: docs
repo_url: https://github.com/sync-dev-org/tensoracle
repo_name: sync-dev-org/tensoracle
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - python/src
            # Standalone source archives keep src next to pyproject.toml.
            - src
          options:
            docstring_style: google
            members: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_if_no_docstring: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - Optimization workflow: optimization.md
  - TensorRT SDK setup: tensorrt-sdk.md
  - API reference:
      - Engine and comparison: api/index.md
      - Cubin bundle inspection: api/bundle.md
      - Cubin producer: api/producer.md
